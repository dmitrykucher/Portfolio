<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 720 405" role="img">
  <title>Screen mirroring user flow</title>
  <desc>Two lanes, Phone and Spectacles. On the phone, the user opens the Spectacles app and selects the mirroring extension, then is asked to join the Spectacles Wi-Fi and accept the broadcast permission. No returns to the app. Yes moves to Spectacles: the phone screen is cast and shown in AR, then the user can reposition, resize, anchor or stop it.</desc>
  <style>@font-face{font-family:'GeistDiagram';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GeistDiagram';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GeistDiagram';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GeistDiagram';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
    text{font-family:'GeistDiagram','Geist',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="405" fill="#FFFFFF"/>
  <line x1="64" y1="200" x2="688" y2="200" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="34" y="100" text-anchor="middle" font-weight="600" font-size="10" fill="#6E6E6E" letter-spacing="1.2" transform="rotate(-90 34 100)">PHONE</text>
  <text x="34" y="302" text-anchor="middle" font-weight="600" font-size="10" fill="#6E6E6E" letter-spacing="1.2" transform="rotate(-90 34 302)">SPECTACLES</text>
  <rect x="76" y="46" width="196" height="88" rx="8" fill="#EDEDED"/>
  <text x="174.0" y="83.9" text-anchor="middle" font-weight="700" font-size="14" fill="#111111">Spectacles app</text>
  <text x="174.0" y="105.9" text-anchor="middle" font-weight="400" font-size="12" fill="#474747">Select mirroring extension</text>
  <rect x="304" y="46" width="224" height="88" rx="8" fill="#EDEDED"/>
  <text x="416.0" y="75.4" text-anchor="middle" font-weight="700" font-size="14" fill="#111111">Join Spectacles Wi-Fi?</text>
  <text x="416.0" y="97.4" text-anchor="middle" font-weight="400" font-size="12" fill="#474747">Accept broadcast permission</text>
  <text x="416.0" y="114.4" text-anchor="middle" font-weight="400" font-size="12" fill="#474747">on phone</text>
  <rect x="364" y="262" width="160" height="88" rx="8" fill="#EDEDED"/>
  <text x="444.0" y="291.4" text-anchor="middle" font-weight="700" font-size="14" fill="#111111">Cast screen</text>
  <text x="444.0" y="313.4" text-anchor="middle" font-weight="400" font-size="12" fill="#474747">Phone screen</text>
  <text x="444.0" y="330.4" text-anchor="middle" font-weight="400" font-size="12" fill="#474747">shown in AR</text>
  <rect x="548" y="262" width="140" height="88" rx="8" fill="#111111"/>
  <text x="618.0" y="291.4" text-anchor="middle" font-weight="700" font-size="14" fill="#FFFFFF">Control</text>
  <text x="618.0" y="313.4" text-anchor="middle" font-weight="400" font-size="12" fill="#D6D6D6">Reposition · Resize</text>
  <text x="618.0" y="330.4" text-anchor="middle" font-weight="400" font-size="12" fill="#D6D6D6">Anchor · Stop</text>
  <path d="M272 90.0 H301" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M348 134 V164 H174.0 V137" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="261.0" y="182" text-anchor="middle" font-weight="500" font-size="12" fill="#4A4A4A">No</text>
  <path d="M444.0 134 V259" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="454.0" y="171.0" text-anchor="start" font-weight="500" font-size="12" fill="#4A4A4A">Yes</text>
  <path d="M524 306.0 H545" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
